name: Harris Teeter connectivity probe

on:
  push:
    branches: ["main"]
    paths:
      - "tools/harris_probe.py"
      - ".github/workflows/harris-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe public Harris Teeter endpoints
        run: python tools/harris_probe.py
