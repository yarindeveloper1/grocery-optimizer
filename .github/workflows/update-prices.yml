name: Update grocery prices

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"
  push:
    branches: ["main"]
    paths:
      - "products.json"
      - "collector/**"
      - "requirements.txt"
      - ".github/workflows/update-prices.yml"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install collector
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Collect localized prices
        run: python collector/collect.py
      - name: Commit refreshed prices
        run: |
          git config user.name "grocery-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/prices.json
          git diff --cached --quiet && exit 0
          git commit -m "Update grocery prices"
          git push
